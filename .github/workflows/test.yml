name: Formula
on:
  pull_request:
  workflow_dispatch:
jobs:
  brew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install from the tap in this checkout
        timeout-minutes: 30
        run: |
          brew tap-new local/sqlide --no-git
          cp Formula/sqlide.rb "$(brew --repository local/sqlide)/Formula/"
          (brew install --verbose local/sqlide/sqlide > brew.log 2>&1; echo "exit=$?" >> brew.log) || true
          tail -3 brew.log
          grep -q "^exit=0" brew.log
      - name: Test
        run: brew test local/sqlide/sqlide
      - name: Run
        run: |
          bin="$(brew --prefix)/bin/sqlide"
          { "$bin" --version; "$bin" doctor; echo "doctor_exit=$?"; } > run.log 2>&1 || true
          cat run.log
          grep -q "^sqlide $(brew list --versions sqlide | awk '{print $2}')" run.log
          grep -q "\[ok\] java" run.log
      - name: Log tail as annotations
        if: always()
        run: |
          { tail -15 brew.log; echo '--- run.log ---'; cat run.log 2>/dev/null; } | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | tr -d '\r' | tail -40 | cut -c1-200 > tail.log
          body=$(sed 's/%/%25/g' tail.log | awk '{printf "%s%%0A", $0}')
          echo "::error title=brew log tail::${body}"
