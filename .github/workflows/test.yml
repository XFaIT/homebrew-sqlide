name: Formula
on:
  push:
  workflow_dispatch:
jobs:
  brew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install from the tap in this checkout
        timeout-minutes: 25
        run: |
          brew tap-new local/sqlide --no-git
          cp Formula/sqlide.rb "$(brew --repository local/sqlide)/Formula/"
          (brew install --verbose --build-from-source local/sqlide/sqlide > brew.log 2>&1; echo "exit=$?" >> brew.log) || true
          tail -3 brew.log
          grep -q "^exit=0" brew.log
      - name: Test
        run: brew test local/sqlide/sqlide
      - name: Run
        run: |
          sqlide --version
          sqlide doctor
      - name: Log tail as annotations
        if: always()
        run: |
          tail -25 brew.log | tr -d '\r' | sed 's/%/%25/g; s/^/::error::/' || true
